<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYONARA</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(255,255,255,.04),transparent 40%),
    radial-gradient(circle at 90% 90%,rgba(255,255,255,.04),transparent 40%),
    #000;
  font-family:Poppins,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* doodles */
.doodle{
  position:fixed;
  font-size:22px;
  opacity:.25;
  animation:float 10s infinite ease-in-out;
}
.d1{top:8%;left:10%;}
.d2{top:75%;left:70%;}
.d3{top:30%;right:10%;}
.d4{bottom:12%;left:20%;}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
}

.card{
  width:90%;
  max-width:430px;
  padding:36px 26px 40px;
  border-radius:28px;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(20px);
  text-align:center;
  animation:fadeIn 1.1s ease;
}
h1{
  font-family:Cinzel,serif;
  font-size:38px;
  letter-spacing:4px;
  background:linear-gradient(90deg,#e6c87a,#fff,#e6c87a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub{
  font-size:13px;
  opacity:.8;
  margin-top:6px;
}
input{
  margin-top:24px;
  width:88%;
  padding:14px;
  border-radius:30px;
  border:none;
  text-align:center;
  font-size:15px;
}
button{
  margin-top:18px;
  padding:12px 36px;
  border-radius:30px;
  border:none;
  background:linear-gradient(135deg,#e6c87a,#caa94a);
  color:#000;
  font-weight:500;
  cursor:pointer;
}
button:hover{transform:scale(1.06);}

#story{display:none;}
.msg{
  margin-top:24px;
  font-size:15px;
  line-height:1.9;
  text-align:left;
  padding:14px 12px;
  border-radius:14px;
  background:rgba(255,255,255,0.03);
  overflow-wrap:break-word;
  min-height:160px;
  position:relative;
}
.cursor{
  display:inline-block;
  width:8px;
  animation:blink 1s infinite;
}
@keyframes blink{
  0%,50%{opacity:1;}
  51%,100%{opacity:0;}
}

.countdown{
  margin-top:18px;
  font-size:14px;
  opacity:.85;
}

.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
}
.popupBox{
  width:90%;
  max-width:450px;
  padding:38px 26px;
  border-radius:30px;
  border:1px solid #e6c87a;
  background:#0e0e0e;
  text-align:center;
  animation:scaleIn .8s ease;
}
.inviteText{
  margin-top:20px;
  font-size:15px;
  line-height:1.9;
}
.footer{
  margin-top:24px;
  font-size:13px;
  opacity:.8;
}

.musicBtn{
  position:fixed;
  top:16px;
  right:16px;
  background:rgba(255,255,255,.1);
  border:1px solid #e6c87a;
  color:#e6c87a;
  padding:8px 14px;
  border-radius:20px;
  font-size:12px;
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(.9);}
  to{opacity:1;transform:scale(1);}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.85);}
  to{opacity:1;transform:scale(1);}
}
</style>
</head>

<body>

<!-- doodles -->
<div class="doodle d1">✦</div>
<div class="doodle d2">☾</div>
<div class="doodle d3">❀</div>
<div class="doodle d4">✨</div>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_9c9b94cfa4.mp3">
</audio>
<button class="musicBtn" onclick="toggleMusic()">🎵 Music</button>

<div class="card" id="start">
  <h1>SAYONARA</h1>
  <div class="sub">Enter your name</div>
  <input id="name" placeholder="Your Name">
  <br>
  <button onclick="start()">Continue</button>
</div>

<div class="card" id="story">
  <h1 id="userName"></h1>
  <div class="msg" id="message"></div>
  <div class="countdown" id="timer"></div>
  <button onclick="openInvite()">Open Invitation</button>
</div>

<div class="popup" id="popup">
  <div class="popupBox">
    <h1>SAYONARA</h1>
    <div class="inviteText">
      A goodbye wrapped in memories,<br>
      laughter, chaos & silence.
      <br><br>
      📅 <b>31 January</b><br>
      📍 <b>Pushpanjali</b>
    </div>
    <div class="footer">
      Some endings quietly become beginnings.
    </div>
    <button style="margin-top:26px" onclick="closeInvite()">See you there</button>
  </div>
</div>

<script>
const personalMessages={
  "navya":`You were never just a classmate.
Some people become comfort without trying.
This place will remember you longer
than you imagine.`,

  "rahul":`From chaos to calm moments,
you added your own signature to school.
This goodbye carries your echo.`
};

const fallbackMessage=`Every name here meant something.
Not all stories were loud,
some were gentle and lasting.
This is not the end —
just a pause before life begins again.`;

/* typing with cursor */
function typeEffect(el,text){
  el.innerHTML="";
  let i=0;
  const cursor=document.createElement("span");
  cursor.className="cursor";
  cursor.innerText="|";
  el.appendChild(cursor);

  const interval=setInterval(()=>{
    cursor.insertAdjacentText("beforebegin",text.charAt(i));
    i++;
    if(i>=text.length){
      clearInterval(interval);
      cursor.remove();
    }
  },28);
}

function start(){
  const name=document.getElementById("name").value.trim();
  if(!name) return alert("Enter your name");

  document.getElementById("start").style.display="none";
  document.getElementById("story").style.display="block";
  document.getElementById("userName").innerText="Dear "+name+",";

  const key=name.toLowerCase();
  typeEffect(
    document.getElementById("message"),
    personalMessages[key]||fallbackMessage
  );

  startCountdown();
}

/* countdown */
function startCountdown(){
  const target=new Date("2026-01-31T00:00:00").getTime();
  setInterval(()=>{
    const now=Date.now();
    const diff=target-now;
    if(diff<=0){
      document.getElementById("timer").innerText="Today is the day ✨";
      return;
    }
    const d=Math.floor(diff/(1000*60*60*24));
    const h=Math.floor(diff/(1000*60*60))%24;
    const m=Math.floor(diff/(1000*60))%60;
    document.getElementById("timer").innerText=
      `⏳ ${d} days ${h} hrs ${m} mins remaining`;
  },1000);
}

/* music */
let playing=false;
function toggleMusic(){
  const m=document.getElementById("bgm");
  playing?m.pause():m.play();
  playing=!playing;
}

function openInvite(){
  document.getElementById("popup").style.display="flex";
}
function closeInvite(){
  document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
